[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "failurealert"
version = "0.1.0"
description = "Phone-based IoT movement and anti-theft system (classroom MVP)"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "aiomqtt>=2.5,<3",
    "fastapi>=0.116,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
failurealert = "failurealert.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "coverage>=7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/failurealert"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
